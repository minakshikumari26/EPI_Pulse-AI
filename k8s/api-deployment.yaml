apiVersion: apps/v1
kind: Deployment
metadata:
  name: epipulse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: epipulse-api
  template:
    metadata:
      labels:
        app: epipulse-api
    spec:
      containers:
        - name: api
          image: epipulse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: epipulse-api
spec:
  selector:
    app: epipulse-api
  ports:
    - port: 8000
      targetPort: 8000

