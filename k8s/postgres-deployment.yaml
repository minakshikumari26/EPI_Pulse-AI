apiVersion: apps/v1
kind: Deployment
metadata:
  name: epipulse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epipulse-postgres
  template:
    metadata:
      labels:
        app: epipulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: epipulse
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
---
apiVersion: v1
kind: Service
metadata:
  name: epipulse-postgres
spec:
  selector:
    app: epipulse-postgres
  ports:
    - port: 5432
      targetPort: 5432

