apiVersion: apps/v1
kind: Deployment
metadata:
  name: epipulse-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epipulse-dashboard
  template:
    metadata:
      labels:
        app: epipulse-dashboard
    spec:
      containers:
        - name: dashboard
          image: epipulse-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: epipulse-dashboard
spec:
  selector:
    app: epipulse-dashboard
  ports:
    - port: 8501
      targetPort: 8501

